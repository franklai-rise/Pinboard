name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'scripts/check-site.mjs'
      - 'docs/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - name: Build only the public website
        run: node scripts/build-site.mjs --refresh-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check assets, links, privacy and download destinations
        run: node scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
