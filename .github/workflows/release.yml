name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check public tree for personal data
        shell: pwsh
        run: ./scripts/check-public-privacy.ps1
      - name: Build and verify release
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/Pinboard-windows-x64.zip
          artifacts/Pinboard-windows-x64.zip.sha256
          --verify-tag
          --generate-notes
