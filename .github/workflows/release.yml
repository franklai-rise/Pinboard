name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check public tree for personal data
        shell: pwsh
        run: ./scripts/check-public-privacy.ps1
      - name: Build and verify release
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [xml]$project = Get-Content src/Pinboard.App/Pinboard.App.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag does not match the application version."
          }
          $notesPath = "docs/releases/$env:RELEASE_TAG.md"
          $notesArguments = if (Test-Path -LiteralPath $notesPath) { @("--notes-file", $notesPath) } else { @("--generate-notes") }
          $assets = @(
            "artifacts/Pinboard-windows-x64.zip",
            "artifacts/Pinboard-windows-x64.zip.sha256"
          )

          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; updating its assets."
            gh release upload "$env:RELEASE_TAG" @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (Test-Path -LiteralPath $notesPath) {
              gh release edit "$env:RELEASE_TAG" --title "Pinboard $env:RELEASE_TAG" --notes-file $notesPath
            }
          }
          else {
            gh release create "$env:RELEASE_TAG" @assets --verify-tag --title "Pinboard $env:RELEASE_TAG" @notesArguments
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
